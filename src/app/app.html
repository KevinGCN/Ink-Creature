<div class="layout" [class.sidebar-open]="sidebarExpanded" appTooltip>
  <app-loading-bar></app-loading-bar>
  <button
    type="button"
    class="menu-toggle"
    (click)="toggleSidebar()"
    [attr.aria-label]="sidebarExpanded ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="sidebarExpanded"
  >
    {{ sidebarExpanded ? '✕' : '☰' }}
  </button>
  <section class="user-navbar">
    <app-user-navbar></app-user-navbar>
  </section>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
  <section class="main-navbar">
    <app-main-navbar [collapsed]="!sidebarExpanded"></app-main-navbar>
  </section>

  <!-- Avisos del proyecto (toasts propios, reemplazan los alert() nativos) -->
  <app-toasts />
  <!-- Confirmación del proyecto (modal propio, reemplaza el confirm() nativo) -->
  <app-confirmacion-modal />

</div>
