<div class="gallery">
  <h1 class="title">Galería</h1>

  <!-- Grid tipo mosaico -->
  <div class="grid">
    <!-- Bendy -->
    <div class="grid-item" (click)="openImage('image/bendy.jpg')">
      <img src="image/bendy.jpg" alt="Tatuaje Bendy" (error)="handleImageError($event)">
    </div>

    <!-- Goku -->
    <div class="grid-item" (click)="openImage('image/goku.webp')">
      <img src="image/goku.webp" alt="Goku Angel" (error)="handleImageError($event)">
    </div>

    <!-- sorodita -->
    <div class="grid-item" (click)="openImage('image/sorodita.png')">
      <img src="image/sorodita.png" alt="Tatuaje sorodita" (error)="handleImageError($event)">
    </div>

    <!-- arquemis -->
    <div class="grid-item" (click)="openImage('image/arquemis.png')">
      <img src="image/arquemis.png" alt="arquemis" (error)="handleImageError($event)">

    <!-- ladymaria -->

      <img src="image/bendy.jpg" alt="Tatuaje Bendy" (error)="handleImageError($event)">
    </div>

    <!-- Goku 5 -->
    <div class="grid-item" (click)="openImage('image/goku.webp')">

    </div>

  <div class="image-viewer" *ngIf="selectedImage" (click)="closeImage()">
    <img [src]="selectedImage" alt="Imagen ampliada">
  </div>
</div>
