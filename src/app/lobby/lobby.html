<!-- CONTENIDO PRINCIPAL -->
<div class="main-content">
  <!-- Aviso de acceso restringido -->
  @if (mensajeAcceso) {
    <div class="aviso-acceso" role="status">
      {{ mensajeAcceso }}
      <a routerLink="/loggin" [queryParams]="{ volver: destinoAcceso }">Iniciar sesión</a>
    </div>
  }

  <!-- Banner -->
  <section class="banner">
    <div class="actions">
      <h1>Bienvenido</h1>
    </div>

    <div class="buttons">
      <button class="btn-primary" routerLink="/schedule">Agendar Cita</button>
      <button class="btn-secondary" routerLink="/information">Cómo encontrarnos</button>
    </div>
  </section>

  <!-- Comentarios -->
  <div class="comments">
    <app-comments></app-comments>
  </div>

  <!-- Botones de IA -->
  <div class="IA">
    <button routerLink="/tattoo-ia">Obten una Cotización Rápida</button>
    @if (auth.isLoggedIn$ | async) {
      <button (click)="abrirCotizacionIA()">Obten una Cotización con IA</button>
    }
  </div>
</div>
