<div class="overlay" (click)="cerrarModal()"></div>

<div class="login-container">

  <div class="header">
    <span>Ink-Creature</span>
    <button class="close-btn" (click)="cerrarModal()">✕</button>
  </div>

  <div class="content">

    <!-- LOGIN -->
    <div *ngIf="!modoRegistro">
      <h2>Iniciar sesión</h2>
      
      <!-- Botón Google ARRIBA -->
      <button (click)="loginConGoogle()" [disabled]="cargandoGoogle" class="google-btn">
       <img src="/image/google.webp" alt="Google" width="20" height="20">
        {{ cargandoGoogle ? 'Iniciando...' : 'Google' }}
      </button>

      <div class="divider"><span>o</span></div>

      <label>Correo</label>
      <input type="email" [(ngModel)]="correo" name="correo" placeholder="Correo electrónico">

      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña">

       <button class="login-btn" (click)="iniciarSesion()" [disabled]="cargandoLogin">
         {{ cargandoLogin ? 'Iniciando...' : 'Iniciar sesión' }}
       </button>

      <div class="divider"><span>o</span></div>

      <button class="register-btn" (click)="irARegistro()">
        Registrarse
      </button>
    </div>

    <!-- REGISTRO -->
    <div *ngIf="modoRegistro">
      <!-- Botón volver (pequeño, izquierda) -->
      <button class="back-btn" (click)="irALogin()">
        ← Volver
      </button>

      <h2>Crear cuenta</h2>

      <label>Nombre</label>
      <input type="text" [(ngModel)]="nombre" name="nombre">

      <label>Correo</label>
      <input type="email" [(ngModel)]="correo" name="correo">

      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password">

       <button class="register-btn" (click)="registrarse()" [disabled]="cargandoRegistro">
         {{ cargandoRegistro ? 'Registrando...' : 'Registrarse' }}
       </button>

      <div class="divider"><span>o</span></div>

      <!-- Botón Google ABAJO -->
      <button (click)="loginConGoogle()" [disabled]="cargandoGoogle" class="google-btn">
        <img src="/image/google.webp" alt="Google" width="20" height="20">
        {{ cargandoGoogle ? 'Iniciando...' : ' Google' }}
      </button>
    </div>

  </div>
</div>
