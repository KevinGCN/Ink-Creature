<div class="overlay" (click)="cerrarModal()"></div>

<div class="login-container">

  <div class="header">
    <span>Ink-Creature</span>
    <button class="close-btn" (click)="cerrarModal()" aria-label="Cerrar">✕</button>
  </div>

  <div class="content">

    <!-- LOGIN -->
    <div *ngIf="!modoRegistro">
      <h2>Iniciar sesión</h2>
      
      <!-- Botón Google ARRIBA -->
      <button (click)="loginConGoogle()" [disabled]="cargandoGoogle" class="google-btn">
       <img src="/image/google.webp" alt="" width="20" height="20">
        {{ cargandoGoogle ? 'Iniciando...' : 'Google' }}
      </button>

      <div class="divider"><span>o</span></div>

      <label for="login-correo">Correo</label>
      <input id="login-correo" type="email" [(ngModel)]="correo" name="correo" placeholder="Correo electrónico" required autocomplete="email">

      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required autocomplete="current-password">

       <button class="login-btn" (click)="iniciarSesion()" [disabled]="cargandoLogin">
         {{ cargandoLogin ? 'Iniciando...' : 'Iniciar sesión' }}
       </button>

      <div class="divider"><span>o</span></div>

      <button class="register-btn" (click)="irARegistro()">
        Registrarse
      </button>
    </div>

    <!-- REGISTRO -->
    <div *ngIf="modoRegistro">
      <!-- Botón volver (pequeño, izquierda) -->
      <button class="back-btn" (click)="irALogin()">
        ← Volver
      </button>

      <h2>Crear cuenta</h2>

      <label for="registro-nombre">Nombre</label>
      <input id="registro-nombre" type="text" [(ngModel)]="nombre" name="nombre" required minlength="2" autocomplete="name">

      <label for="registro-correo">Correo</label>
      <input id="registro-correo" type="email" [(ngModel)]="correo" name="correo" required autocomplete="email">

      <label for="registro-password">Contraseña</label>
      <input id="registro-password" type="password" [(ngModel)]="password" name="password" required minlength="8" autocomplete="new-password">

       <button class="register-btn" (click)="registrarse()" [disabled]="cargandoRegistro">
         {{ cargandoRegistro ? 'Registrando...' : 'Registrarse' }}
       </button>

      <div class="divider"><span>o</span></div>

      <!-- Botón Google ABAJO -->
      <button (click)="loginConGoogle()" [disabled]="cargandoGoogle" class="google-btn">
        <img src="/image/google.webp" alt="" width="20" height="20">
        {{ cargandoGoogle ? 'Iniciando...' : ' Google' }}
      </button>
    </div>

    <p class="success-msg" *ngIf="mensajeExito" role="status">{{ mensajeExito }}</p>
    <p class="error-msg" *ngIf="mensajeError" role="alert">{{ mensajeError }}</p>
    <p class="info-msg" *ngIf="avisoDemora" role="status">{{ avisoDemora }}</p>

  </div>
</div>
