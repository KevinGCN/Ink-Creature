<nav class="userbar" aria-label="Barra de usuario">
  <div class="usuario">

     <button *ngIf="!(auth.isLoggedIn$ | async)" (click)="abrirLogin()">
       Sesión
     </button>

     <div *ngIf="auth.isLoggedIn$ | async" class="menu-ajustes">

      <button
        (click)="toggleAjustes()"
        aria-haspopup="menu"
        [attr.aria-expanded]="mostrarAjustes"
      >
        ⚙️ Ajustes
      </button>

      <div class="dropdown" *ngIf="mostrarAjustes" role="menu">

        <button role="menuitem" (click)="irAjustes()">
          Ajustes
        </button>

        <button role="menuitem" (click)="logout()">
          Cerrar sesión
        </button>

      </div>
    </div>

  </div>
</nav>


<app-loggin 
  *ngIf="mostrarLogin" 
  (cerrar)="cerrarLogin()">
</app-loggin>
