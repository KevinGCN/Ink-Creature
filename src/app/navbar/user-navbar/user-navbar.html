<nav class="userbar">
  <div class="usuario">

    <!-- NO LOGUEADO -->
    <button *ngIf="!auth.estaLogueado()" (click)="abrirLogin()">
      Sesión
    </button>

    <!-- LOGUEADO -->
    <div *ngIf="auth.estaLogueado()">
      <a routerLink="/profile">⚙️ Ajustes</a>
      <button (click)="auth.logout()">Cerrar sesión</button>
    </div>

  </div>
</nav>

<app-loggin 
  *ngIf="mostrarLogin" 
  (cerrar)="cerrarLogin()">
</app-loggin>
