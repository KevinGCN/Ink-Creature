<div class="ai-container">

  <h1>Ink Creature AI</h1>

  <textarea
    id="tattooPrompt"
    name="tattooPrompt"
    [(ngModel)]="prompt"
    placeholder="Describe tu tatuaje..."
  ></textarea>

  <button (click)="generateTattoo()">
    Generar
  </button>

  <div *ngIf="loading">
    Generando diseño...
  </div>

  <div *ngIf="response">

    <h2>Resultado:</h2>

    <pre>
{{ response }}
    </pre>

  </div>

</div>
